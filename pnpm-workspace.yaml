packages:
  - apps/*
  - packages/*

overrides:
  postcss: 8.5.10
  uuid: 11.1.1

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  prisma: true
  sharp: true
  cpu-features: true
  ssh2: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - esbuild
  - msgpackr-extract
  - protobufjs
  - prisma
  - sharp
  - cpu-features
  - ssh2
