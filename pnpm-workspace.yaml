packages:
  - apps/*
  - packages/*

overrides:
  '@noble/hashes': 1.7.2
  'brace-expansion@<2.0.0': 1.1.18
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.4
  'js-yaml@<4.0.0': 3.15.1
  'js-yaml@>=4.0.0 <5.0.0': 4.3.1
  'nanoid@<4.0.0': 3.3.17
  postcss: 8.5.23
  sharp: 0.35.0
  uuid: 11.1.1

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  prisma: true
  sharp: true
  cpu-features: true
  ssh2: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - esbuild
  - msgpackr-extract
  - protobufjs
  - prisma
  - sharp
  - cpu-features
  - ssh2
