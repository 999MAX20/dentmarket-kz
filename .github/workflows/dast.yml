name: DAST
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "HTTPS staging URL"
        required: true
        type: string
jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: DAST_BASE_URL="${{ inputs.target_url }}" node scripts/verify-dast-config.mjs
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          fail_action: true
          allow_issue_writing: false
