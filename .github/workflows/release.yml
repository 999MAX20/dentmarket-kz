name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Immutable image tag
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, admin-web, buyer-web, supplier-web, landing-web]
    steps:
      - uses: actions/checkout@v4
      - name: Validate public build configuration
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          BUYER_APP_URL: ${{ vars.BUYER_APP_URL }}
          SUPPLIER_APP_URL: ${{ vars.SUPPLIER_APP_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          APPLE_REDIRECT_URI: ${{ vars.APPLE_REDIRECT_URI }}
        run: |
          for name in PUBLIC_API_URL BUYER_APP_URL SUPPLIER_APP_URL GOOGLE_CLIENT_ID APPLE_CLIENT_ID APPLE_REDIRECT_URI; do
            test -n "${!name}" || { echo "Missing repository variable: $name" >&2; exit 1; }
          done
          case "$PUBLIC_API_URL $BUYER_APP_URL $SUPPLIER_APP_URL" in *localhost*|*127.0.0.1*) echo "Local URL in release configuration" >&2; exit 1;; esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/marketplace-${{ matrix.target }}:${{ inputs.release || github.ref_name }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
            NEXT_PUBLIC_BUYER_APP_URL=${{ vars.BUYER_APP_URL }}
            NEXT_PUBLIC_SUPPLIER_APP_URL=${{ vars.SUPPLIER_APP_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_APPLE_CLIENT_ID=${{ vars.APPLE_CLIENT_ID }}
            NEXT_PUBLIC_APPLE_REDIRECT_URI=${{ vars.APPLE_REDIRECT_URI }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
