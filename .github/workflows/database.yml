name: Deploy database migrations

on:
  workflow_dispatch:
    inputs:
      sync_catalog:
        description: Sync canonical catalog cards and SKU variants
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate database secret
        run: test -n "$DATABASE_URL"
      - name: Apply pending Prisma migrations
        run: pnpm --filter @marketplace/api exec prisma migrate deploy
      - name: Sync canonical catalog and SKU variants
        if: ${{ inputs.sync_catalog }}
        run: pnpm catalog:sync-production:apply
