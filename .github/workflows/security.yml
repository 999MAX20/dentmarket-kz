name: Security

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  actions: read
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: sarif-results
      - name: Fail on CodeQL errors
        run: |
          test -n "$(find sarif-results -name '*.sarif' -print -quit)"
          if jq -e '[.runs[].results[]? | select(.level == "error")] | length > 0' sarif-results/*.sarif >/dev/null; then
            echo "CodeQL found error-level security results" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 30

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
